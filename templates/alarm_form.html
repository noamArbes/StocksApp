{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h2>{{ title }}</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" id="alarm-form">
        <label id="label-ticker">Ticker
            <input type="text" name="ticker" id="ticker-input"
                value="{{ form.get('ticker', '') }}"
                placeholder="e.g. AAPL" autocomplete="off"
                {% if alarm %}readonly{% endif %}>
            {% if not alarm %}
            <div class="autocomplete-dropdown" id="ticker-dropdown"></div>
            {% endif %}
        </label>

        <div class="radio-group">
            <label>
                <input type="radio" name="alarm_type" value="price"
                    {% if not (form.get('upper_pct') or form.get('lower_pct')) %}checked{% endif %}>
                Price Limits
            </label>
            <label>
                <input type="radio" name="alarm_type" value="pct"
                    {% if form.get('upper_pct') or form.get('lower_pct') %}checked{% endif %}>
                Percentage Change
            </label>
        </div>

        <div id="price-fields">
            <label id="label-price-limit">At least one price limit required
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:0.25rem">
                    <div>
                        <span style="font-size:0.82rem;color:#7a6a5a">Upper Limit ($) — optional</span>
                        <input type="number" step="0.01" name="upper_limit"
                            value="{{ form.get('upper_limit', '') }}"
                            placeholder="e.g. 300.00">
                    </div>
                    <div>
                        <span style="font-size:0.82rem;color:#7a6a5a">Lower Limit ($) — optional</span>
                        <input type="number" step="0.01" name="lower_limit"
                            value="{{ form.get('lower_limit', '') }}"
                            placeholder="e.g. 50.00">
                    </div>
                </div>
            </label>
        </div>

        <div id="pct-fields" style="display:none">
            <label id="label-pct-limit">At least one percentage required
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:0.25rem">
                    <div>
                        <span style="font-size:0.82rem;color:#7a6a5a">Rise % — optional</span>
                        <input type="number" step="0.1" name="upper_pct"
                            value="{{ form.get('upper_pct', '') }}"
                            placeholder="e.g. 5">
                    </div>
                    <div>
                        <span style="font-size:0.82rem;color:#7a6a5a">Drop % — optional</span>
                        <input type="number" step="0.1" name="lower_pct"
                            value="{{ form.get('lower_pct', '') }}"
                            placeholder="e.g. 5">
                    </div>
                </div>
            </label>
        </div>

        <label id="label-email">Email(s) — comma-separated for multiple
            <input type="text" name="email" id="email-input"
                value="{{ form.get('email', '') }}"
                placeholder="you@example.com">
        </label>

        <label id="label-city">City (for timezone) *
            <input type="text" id="city-input" autocomplete="off" placeholder="e.g. Tel Aviv">
            <div class="autocomplete-dropdown" id="city-dropdown"></div>
        </label>
        <input type="hidden" name="timezone" id="timezone-hidden" value="{{ form.get('timezone') or '' }}">

        <label>Re-alert cooldown — minimum time between repeat alerts
            <select name="snooze_hours">
                {% set cur_snooze = form.get('snooze_hours', 72)|int %}
                <option value="1"   {% if cur_snooze == 1   %}selected{% endif %}>1 hour</option>
                <option value="6"   {% if cur_snooze == 6   %}selected{% endif %}>6 hours</option>
                <option value="24"  {% if cur_snooze == 24  %}selected{% endif %}>1 day</option>
                <option value="72"  {% if cur_snooze == 72  %}selected{% endif %}>3 days (default)</option>
                <option value="168" {% if cur_snooze == 168 %}selected{% endif %}>1 week</option>
            </select>
        </label>

        <label>Notes — optional reminder to yourself
            <textarea name="notes" rows="2" placeholder="e.g. stop loss, take profit target">{{ form.get('notes') or '' }}</textarea>
        </label>

        <label class="checkbox-label">
            <input type="checkbox" name="enabled"
                {% if form.get('enabled', True) %}checked{% endif %}>
            Enabled
        </label>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{{ url_for('dashboard') }}" class="btn">Cancel</a>
            {% if alarm %}
            <button type="button" id="test-email-btn" class="btn" style="margin-left:auto">Send test email</button>
            {% endif %}
        </div>
        {% if alarm %}
        <p id="test-email-status" style="font-size:0.85rem;margin-top:0.5rem;display:none"></p>
        {% endif %}
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
// ── Alarm type toggle ────────────────────────────────────────
const radios = document.querySelectorAll('[name=alarm_type]');
const priceFields = document.getElementById('price-fields');
const pctFields = document.getElementById('pct-fields');
function updateFields() {
    const isPct = document.querySelector('[name=alarm_type]:checked').value === 'pct';
    priceFields.style.display = isPct ? 'none' : '';
    pctFields.style.display = isPct ? '' : 'none';
}
radios.forEach(r => r.addEventListener('change', updateFields));
updateFields();

// ── Autocomplete helper ──────────────────────────────────────
function makeAutocomplete(input, dropdown, fetchFn, onSelect) {
    let timer = null;

    input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { dropdown.innerHTML = ''; dropdown.style.display = 'none'; return; }
        timer = setTimeout(() => {
            fetchFn(q).then(items => {
                if (!items.length) { dropdown.innerHTML = ''; dropdown.style.display = 'none'; return; }
                dropdown.innerHTML = '';
                items.forEach(item => {
                    const el = document.createElement('div');
                    el.className = 'autocomplete-item';
                    el.textContent = item.label;
                    el.addEventListener('mousedown', e => {
                        e.preventDefault();
                        onSelect(item);
                        dropdown.innerHTML = '';
                        dropdown.style.display = 'none';
                    });
                    dropdown.appendChild(el);
                });
                dropdown.style.display = 'block';
            });
        }, 300);
    });

    input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { dropdown.innerHTML = ''; dropdown.style.display = 'none'; }
    });

    document.addEventListener('click', e => {
        if (!input.contains(e.target) && !dropdown.contains(e.target)) {
            dropdown.innerHTML = ''; dropdown.style.display = 'none';
        }
    });
}

// ── Ticker autocomplete (new alarm only) ─────────────────────
const tickerInput = document.getElementById('ticker-input');
const tickerDropdown = document.getElementById('ticker-dropdown');
if (tickerDropdown) {
    makeAutocomplete(tickerInput, tickerDropdown,
        q => fetch('/ticker-search?q=' + encodeURIComponent(q)).then(r => r.json()).then(items =>
            items.map(i => ({ label: i.symbol + ' — ' + i.name, value: i.symbol }))
        ),
        item => { tickerInput.value = item.value; }
    );
}

// ── City autocomplete ────────────────────────────────────────
const cityInput = document.getElementById('city-input');
const cityDropdown = document.getElementById('city-dropdown');
const timezoneHidden = document.getElementById('timezone-hidden');

makeAutocomplete(cityInput, cityDropdown,
    q => fetch('/city-search?q=' + encodeURIComponent(q)).then(r => r.json()).then(items =>
        items.map(i => ({ label: i.city + ' — ' + i.country, timezone: i.timezone }))
    ),
    item => {
        cityInput.value = item.label;
        timezoneHidden.value = item.timezone;
        document.getElementById('label-city').classList.remove('field-error');
    }
);

// Pre-fill city input on edit when timezone already set
(function() {
    const tz = timezoneHidden.value;
    if (!tz) return;
    fetch('/timezone-to-city?tz=' + encodeURIComponent(tz))
        .then(r => r.json())
        .then(city => {
            if (city) {
                cityInput.value = city.city + ' — ' + city.country;
            } else {
                cityInput.value = tz;
            }
        });
})();

// ── Client-side validation ───────────────────────────────────
document.getElementById('alarm-form').addEventListener('submit', function(e) {
    let ok = true;

    function setError(labelId, msg) {
        const lbl = document.getElementById(labelId);
        lbl.classList.add('field-error');
        let span = lbl.querySelector('.field-error-msg');
        if (!span) { span = document.createElement('span'); span.className = 'field-error-msg'; lbl.appendChild(span); }
        span.textContent = msg;
        ok = false;
    }

    function clearError(labelId) {
        const lbl = document.getElementById(labelId);
        lbl.classList.remove('field-error');
        const span = lbl.querySelector('.field-error-msg');
        if (span) span.remove();
    }

    // Ticker
    if (!tickerInput.value.trim()) {
        setError('label-ticker', 'Ticker is required');
    } else {
        clearError('label-ticker');
    }

    // Limit fields
    const isPct = document.querySelector('[name=alarm_type]:checked').value === 'pct';
    if (isPct) {
        const up = document.querySelector('[name=upper_pct]').value.trim();
        const lo = document.querySelector('[name=lower_pct]').value.trim();
        if (!up && !lo) { setError('label-pct-limit', 'At least one percentage threshold is required'); }
        else { clearError('label-pct-limit'); }
    } else {
        const up = document.querySelector('[name=upper_limit]').value.trim();
        const lo = document.querySelector('[name=lower_limit]').value.trim();
        if (!up && !lo) { setError('label-price-limit', 'At least one price limit is required'); }
        else { clearError('label-price-limit'); }
    }

    // Email
    if (!document.getElementById('email-input').value.trim()) {
        setError('label-email', 'Email is required');
    } else {
        clearError('label-email');
    }

    // Timezone
    if (!timezoneHidden.value.trim()) {
        setError('label-city', 'Please select a city from the dropdown');
    } else {
        clearError('label-city');
    }

    if (!ok) e.preventDefault();
});

// Clear field errors on input
['ticker-input', 'email-input', 'city-input'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', () => {
        const lbl = el.closest('label');
        if (lbl) { lbl.classList.remove('field-error'); const s = lbl.querySelector('.field-error-msg'); if (s) s.remove(); }
    });
});
document.querySelectorAll('[name=upper_limit],[name=lower_limit]').forEach(el => {
    el.addEventListener('input', () => { clearErrorOnParent('label-price-limit'); });
});
document.querySelectorAll('[name=upper_pct],[name=lower_pct]').forEach(el => {
    el.addEventListener('input', () => { clearErrorOnParent('label-pct-limit'); });
});
function clearErrorOnParent(labelId) {
    const lbl = document.getElementById(labelId);
    lbl.classList.remove('field-error');
    const s = lbl.querySelector('.field-error-msg');
    if (s) s.remove();
}

// ── Test email ───────────────────────────────────────────────
const testBtn = document.getElementById('test-email-btn');
if (testBtn) {
    testBtn.addEventListener('click', () => {
        const status = document.getElementById('test-email-status');
        testBtn.disabled = true;
        testBtn.textContent = 'Sending…';
        status.style.display = 'none';
        fetch(window.location.pathname.replace('/edit', '/test-email'), { method: 'POST' })
            .then(r => r.json())
            .then(data => {
                status.style.display = 'block';
                if (data.ok) {
                    status.style.color = '#6fcf6f';
                    status.textContent = 'Test email sent!';
                } else {
                    status.style.color = '#e07070';
                    status.textContent = 'Error: ' + (data.error || 'unknown');
                }
            })
            .catch(() => {
                status.style.display = 'block';
                status.style.color = '#e07070';
                status.textContent = 'Failed to send.';
            })
            .finally(() => {
                testBtn.disabled = false;
                testBtn.textContent = 'Send test email';
            });
    });
}
</script>
{% endblock %}
