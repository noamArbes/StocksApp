{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
    <h1>StocksApp</h1>
    <form method="post" action="/login">
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <input type="password" name="password" placeholder="Password" autofocus>
        <button type="submit">Sign in</button>
    </form>
</div>
{% endblock %}
